name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m compileall -q src scripts tests main.py
      - run: uv run python -m pytest -q
      - run: uv run black --check src scripts tests main.py
      - run: uv run isort --check-only src scripts tests main.py
      - run: >-
          uv run mypy src/api/routes.py src/models/bundle.py src/metrics/event_store.py
          src/ranking src/recall src/generation/profile_expansion.py src/data/loader.py
