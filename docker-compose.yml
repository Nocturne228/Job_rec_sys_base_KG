services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      JOBREC_BUNDLE_PATH: models/jobrec_bundle.json
      JOBREC_EVENT_DB: /app/data/jobrec_events.sqlite3
    volumes:
      - jobrec-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  jobrec-data:
